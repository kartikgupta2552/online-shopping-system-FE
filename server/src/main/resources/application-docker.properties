# Database configuration for Docker environment
spring.datasource.url=jdbc:mysql://mysql:3306/apnacart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Manager@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings for Docker
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-fallback-secret-key}
jwt.expiration=86400000

# Logging configuration (so you can debug like a boss)
logging.level.com.apnacart=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=/app/logs/apnacart.log

# Server configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# CORS configuration for Docker
cors.allowed-origins=http://localhost:80,http://localhost:3000

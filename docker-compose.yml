version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: apnacart-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: apnacart
      MYSQL_USER: apnacart_user
      MYSQL_PASSWORD: apnacart_pass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: apnacart-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apnacart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: apnacart_user
      SPRING_DATASOURCE_PASSWORD: apnacart_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: "your-super-secret-jwt-key-that-nobody-should-know"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: apnacart-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  db_data:

